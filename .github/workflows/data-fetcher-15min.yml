name: HK Stock SMA Data Fetcher (15min cron + daemon --once)

on:
  schedule:
    # every 15 minutes (UTC) — roughly aligns with HK market refresh interval
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      extra_symbols:
        description: "Optional comma-separated tickers to force refresh (e.g. 0700,0005,9988.HK,00001.HK). Default uses bootstrap+cached+Firestore watchlist."
        required: false
        type: string
        default: ""
      log_level:
        description: "Python logging level"
        required: false
        type: choice
        options: ["DEBUG", "INFO", "WARNING", "ERROR"]
        default: "INFO"

permissions:
  contents: read
  actions: read
  packages: none

concurrency:
  group: data-fetcher-15min
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"
  LOG_LEVEL: ${{ inputs.log_level || 'INFO' }}
  # Force SQLite cache DB location to a dedicated path on the runner (repo-relative)
  OHLCV_CACHE_DB: ${{ github.workspace }}/artifacts/ohlcv_cache.sqlite
  # Artifact name suffix for v5 workflow (v4 uploads are NOT compatible with v5 download toolkit)
  ARTIFACT_NAME: ohlcv-cache-artifact-v5

jobs:
  fetch-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          check-latest: false

      - name: Pip cache
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check if prior v5 artifact exists (skip restore if none, avoid annotation error)
        id: check-artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          set +o pipefail
          ART="$ARTIFACT_NAME"
          # J1: ALWAYS write SAFE DEFAULTS FIRST so even if the shell exits mid-way,
          #     next step reads restore_enabled=false (will skip restore CLEANLY, no annotation).
          echo "prior_count=0" >> "$GITHUB_OUTPUT"
          echo "restore_enabled=false" >> "$GITHUB_OUTPUT"

          echo "Checking prior artifact name=$ART for repo=${GITHUB_REPOSITORY} ..."
          COUNT="0"
          RAW=""
          # Bash syntax FIX: URL "" closes AFTER per_page=1, then gh api --jq follows OUTSIDE URL quotes.
          RAW=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ART}&per_page=1" --jq '.total_count' 2>/dev/null)
          RC_RAW=$?
          if [[ $RC_RAW -eq 0 && -n "${RAW}" && "${RAW}" =~ ^[0-9]+$ ]]; then
            COUNT="${RAW}"
          else
            echo "gh api fallback (rc=${RC_RAW} raw='${RAW}') -> treating COUNT=0 (skip restore safe default)."
            COUNT="0"
          fi
          echo "Prior artifact count (name=$ART): COUNT=$COUNT (raw gh api='$RAW')"
          # Overwrite defaults AFTER validation succeeds.
          echo "prior_count=$COUNT" >> "$GITHUB_OUTPUT"
          if [[ "$COUNT" -gt 0 ]]; then
            echo "restore_enabled=true"  >> "$GITHUB_OUTPUT"
            echo "✅ Prior v5 artifact found (COUNT=$COUNT), restore will proceed."
          else
            echo "restore_enabled=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  No prior v5 artifact found OR gh api failed (normal on first run). Skipping restore COMPLETELY to avoid annotation errors."
          fi

      - name: Restore previous ohlcv_cache.sqlite (ONLY when prior v5 artifact was actually found)
        # J1 critical: DO NOT USE always() here. Default if: success() && <cond> means:
        #   * if check-artifact step succeeded: restore_enabled is true → run restore
        #   * if check-artifact step failed: GITHUB_OUTPUT still has restore_enabled=false
        #       written in the first lines, BUT default if: success() skips the step anyway →
        #       NO RESTORE EXECUTED → NO "Artifact not found" annotation error.
        if: steps.check-artifact.outputs.restore_enabled == 'true'
        id: restore-cache-artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ github.workspace }}/artifacts
          merge-multiple: false

      - name: (Optional) Write Firebase admin cred from secret if provided
        shell: bash
        env:
          FIREBASE_ADMIN_JSON_B64: ${{ secrets.FIREBASE_ADMIN_CREDENTIAL_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/secrets"
          CREDS_JSON="$RUNNER_TEMP/secrets/firebase-admin.json"
          if [[ -n "${FIREBASE_ADMIN_JSON_B64:-}" ]]; then
            echo "$FIREBASE_ADMIN_JSON_B64" | base64 -d > "$CREDS_JSON"
            echo "FIREBASE_ADMIN_CREDENTIAL_JSON=$CREDS_JSON" >> "$GITHUB_ENV"
            echo "Wrote Firebase admin creds from base64 secret."
          else
            echo "No FIREBASE_ADMIN_CREDENTIAL_B64 secret set. Watchlist pre-seed from Firestore skipped; bootstrap + cached list still runs."
          fi

      - name: Run data fetcher daemon --once (bootstrap + drain queue)
        id: run-daemon
        shell: bash
        continue-on-error: false
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          LOGFILE="$RUNNER_TEMP/logs/daemon.log"
          EXTRA="${{ inputs.extra_symbols }}"
          ARGS=(--once)
          if [[ -n "$EXTRA" ]]; then
            IFS=',' read -r -a arr <<< "$EXTRA"
            for s in "${arr[@]}"; do
              s="$(echo "$s" | xargs)"
              [[ -n "$s" ]] && ARGS+=(--symbol "$s")
            done
          fi
          set -x
          # --- G4 rc handling: disable pipefail + ignore exit during python|tee,
          # then capture ONLY python's exit via PIPESTATUS[0]. This ensures
          # SIGPIPE on tee/tail never masks the daemon exit code.
          set +e
          set +o pipefail
          python -u data_fetcher_daemon.py "${ARGS[@]}" 2>&1 | tee "$LOGFILE"
          DAEMON_RC=${PIPESTATUS[0]}
          set -o pipefail
          set -e
          echo "daemon_exit_code=$DAEMON_RC" >> "$GITHUB_OUTPUT"
          # Append last 60 lines of daemon log to GITHUB_STEP_SUMMARY for quick debug
          {
            echo ""
            echo "---"
            echo "<details><summary>🐞 Daemon log (last 60 lines, rc=$DAEMON_RC)</summary>"
            echo ""
            echo '```text'
            tail -n 60 "$LOGFILE" || true
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "LOGFILE=$LOGFILE" >> "$GITHUB_ENV"
          # Re-raise daemon exit code properly (but never fail on partial success:
          # daemon's main() already returns 0 when processed_ok>=1, 1 only for 0011.HK-style single failures on a first run with 0 ok count -- that is still a legit failure.)
          exit "$DAEMON_RC"

      - name: Print final cache summary
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +euo pipefail
          DB="${{ env.OHLCV_CACHE_DB }}"
          {
            echo ""
            echo "---"
            echo "<details><summary>🗂️  Cache filesystem &amp; stats diagnostics</summary>"
            echo ""
            if [[ -f "$DB" ]]; then
              echo "Disk usage:"
              du -h "$DB" || true
              echo ""
              echo "Python diagnostics:"
              python - <<'PY'
          import os, sys
          sys.path.insert(0, os.getcwd())
          try:
              from cache_layer import get_all_stats, list_cached_symbols, get_cache_db_path
              db = os.environ.get("OHLCV_CACHE_DB") or get_cache_db_path()
              print(f"DB path: {db}")
              stats = get_all_stats(db_path=db) or {}
              print(f"STATS: {dict(stats)}")
              rows = list_cached_symbols(db_path=db, limit=30) or []
              print(f"Top {len(rows)} symbols by last_refresh_ts:")
              for r in rows:
                  print(f"  {str(r.get('symbol','')):>10s}  rows={r.get('rows',0):<6d}  src={str(r.get('source','')):<10s}  close={r.get('last_valid_close')}  td={r.get('last_trade_date')}")
          except Exception as exc:
              print(f"DIAGNOSTICS_ERROR: {type(exc).__name__}: {exc}")
          PY
              RC_PY=$?
            else
              echo "No cache DB found at $DB"
              RC_PY=0
            fi
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload ohlcv_cache.sqlite as artifact (retention 30 days, v5 name)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ github.workspace }}/artifacts/ohlcv_cache.sqlite
          retention-days: 30
          if-no-files-found: ignore
          overwrite: true
