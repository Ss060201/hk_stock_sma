name: HK Stock SMA Data Fetcher (15min cron + daemon --once)

on:
  schedule:
    # every 15 minutes (UTC) — roughly aligns with HK market refresh interval
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      extra_symbols:
        description: "Optional comma-separated tickers to force refresh (e.g. 0700,0005,9988.HK,00001.HK). Default uses bootstrap+cached+Firestore watchlist."
        required: false
        type: string
        default: ""
      log_level:
        description: "Python logging level"
        required: false
        type: choice
        options: ["DEBUG", "INFO", "WARNING", "ERROR"]
        default: "INFO"

permissions:
  contents: read
  actions: read
  packages: none

concurrency:
  group: data-fetcher-15min
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: "utf-8"
  LOG_LEVEL: ${{ inputs.log_level || 'INFO' }}
  # Force SQLite cache DB location to a dedicated path on the runner (repo-relative)
  OHLCV_CACHE_DB: ${{ github.workspace }}/artifacts/ohlcv_cache.sqlite
  # Artifact name suffix for v5 workflow (v4 uploads are NOT compatible with v5 download toolkit)
  ARTIFACT_NAME: ohlcv-cache-artifact-v5
  TUR_AMP_ARTIFACT_NAME: tur-amp-health-report-v1
  TUR_AMP_REPORT_DIR: ${{ github.workspace }}/artifacts/tur_amp

jobs:
  fetch-and-archive:
    runs-on: ubuntu-latest
    # NOTE: first ever "cold" run has to download ~270 tickers of 5Y daily OHLCV
    # from Yahoo Finance, which can easily exceed the default 55m. Incremental
    # runs (with cache artifact restored) finish in ~5-15m. If you want to be
    # safe only for incremental runs, set this back to 60 after the first full
    # cache is built successfully.
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          check-latest: false

      - name: Pip cache
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore previous ohlcv_cache.sqlite (best-effort; failure is harmless)
        id: restore-cache-artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ github.workspace }}/artifacts
          merge-multiple: false

      - name: (Optional) Write Firebase admin cred from secret if provided
        shell: bash
        env:
          FIREBASE_ADMIN_JSON_B64: ${{ secrets.FIREBASE_ADMIN_CREDENTIAL_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/secrets"
          CREDS_JSON="$RUNNER_TEMP/secrets/firebase-admin.json"
          if [[ -n "${FIREBASE_ADMIN_JSON_B64:-}" ]]; then
            echo "$FIREBASE_ADMIN_JSON_B64" | base64 -d > "$CREDS_JSON"
            echo "FIREBASE_ADMIN_CREDENTIAL_JSON=$CREDS_JSON" >> "$GITHUB_ENV"
            echo "Wrote Firebase admin creds from base64 secret."
          else
            echo "No FIREBASE_ADMIN_CREDENTIAL_B64 secret set. Watchlist pre-seed from Firestore skipped; bootstrap + cached list still runs."
          fi

      - name: Run data fetcher daemon --once (bootstrap + drain queue)
        id: run-daemon
        shell: bash
        continue-on-error: false
        env:
          # --- Speed tuning ---
          # ONCE_MODE_WORKERS=3: 3 parallel fetcher threads for cold/incremental
          #   refresh. Safe cap inside daemon code is 4 to avoid Yahoo 429 storms.
          # FETCH_INTERVAL: tighter jitter for incremental run.
          # MAX_429_15MIN: tolerate more 429s before global pause.
          # OHLCV_CACHE_TTL_SEC: critical for incremental speed-up.
          #   Default 15 min = every run re-queues ALL tickers because the
          #   previous run finished >15 min ago. Setting 75 min = within a
          #   60-min window we SKIP the prior run's recently refreshed
          #   tickers (230/270 of them), cutting wall time from ~60 min to
          #   ~10-15 min on second and subsequent runs.
          ONCE_MODE_WORKERS: 3
          FETCH_INTERVAL_MIN_SEC: 0.35
          FETCH_INTERVAL_MAX_SEC: 0.75
          MAX_429_15MIN: 8
          OHLCV_CACHE_TTL_SEC: 4500
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          LOGFILE="$RUNNER_TEMP/logs/daemon.log"
          EXTRA="${{ inputs.extra_symbols }}"
          ARGS=(--once)
          if [[ -n "$EXTRA" ]]; then
            IFS=',' read -r -a arr <<< "$EXTRA"
            for s in "${arr[@]}"; do
              s="$(echo "$s" | xargs)"
              [[ -n "$s" ]] && ARGS+=(--symbol "$s")
            done
          fi
          set -x
          set +e
          set +o pipefail
          python -u data_fetcher_daemon.py "${ARGS[@]}" 2>&1 | tee "$LOGFILE"
          DAEMON_RC=${PIPESTATUS[0]}
          set -o pipefail
          set -e
          echo "daemon_exit_code=$DAEMON_RC" >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "---"
            echo "<details><summary>🐞 Daemon log (last 60 lines, rc=$DAEMON_RC)</summary>"
            echo ""
            echo '```text'
            tail -n 60 "$LOGFILE" || true
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "LOGFILE=$LOGFILE" >> "$GITHUB_ENV"
          exit "$DAEMON_RC"

      - name: Print final cache summary
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +euo pipefail
          DB="${{ env.OHLCV_CACHE_DB }}"
          {
            echo ""
            echo "---"
            echo "<details><summary>🗂️  Cache filesystem &amp; stats diagnostics</summary>"
            echo ""
            if [[ -f "$DB" ]]; then
              echo "Disk usage:"
              du -h "$DB" || true
              echo ""
              echo "Python diagnostics:"
              python - <<'PY'
          import os, sys
          sys.path.insert(0, os.getcwd())
          try:
              from cache_layer import get_all_stats, list_cached_symbols, get_cache_db_path
              db = os.environ.get("OHLCV_CACHE_DB") or get_cache_db_path()
              print(f"DB path: {db}")
              stats = get_all_stats(db_path=db) or {}
              print(f"STATS: {dict(stats)}")
              rows = list_cached_symbols(db_path=db, limit=30) or []
              print(f"Top {len(rows)} symbols by last_refresh_ts:")
              for r in rows:
                  print(f"  {str(r.get('symbol','')):>10s}  rows={r.get('rows',0):<6d}  src={str(r.get('source','')):<10s}  close={r.get('last_valid_close')}  td={r.get('last_trade_date')}")
          except Exception as exc:
              print(f"DIAGNOSTICS_ERROR: {type(exc).__name__}: {exc}")
          PY
              RC_PY=$?
            else
              echo "No cache DB found at $DB"
              RC_PY=0
            fi
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Run TUR/Amp health scan (5-layer ticker union)
        id: tur-amp-scan
        if: always()
        continue-on-error: true
        shell: bash
        env:
          INPUT_EXTRA: ${{ inputs.extra_symbols }}
          TUR_AMP_REPORT_DIR: ${{ env.TUR_AMP_REPORT_DIR }}
          OHLCV_CACHE_DB: ${{ env.OHLCV_CACHE_DB }}
        run: |
          set +euo pipefail
          mkdir -p "${{ env.TUR_AMP_REPORT_DIR }}"
          REPORT_CSV="${{ env.TUR_AMP_REPORT_DIR }}/tur_amp_health_report.csv"
          SUMMARY_JSON="${{ env.TUR_AMP_REPORT_DIR }}/tur_amp_health_summary.json"
          echo "--- PRE-SCAN DIAGNOSTICS"
          if [[ -f "${{ env.OHLCV_CACHE_DB }}" ]]; then
            ls -la "${{ env.OHLCV_CACHE_DB }}"
            du -h "${{ env.OHLCV_CACHE_DB }}"
            python - <<'PY'
          import os, sqlite3
          p = os.environ["OHLCV_CACHE_DB"]
          if os.path.isfile(p):
              conn = sqlite3.connect(f"file:{p}?mode=ro", uri=True)
              try:
                  cur = conn.cursor()
                  cur.execute("SELECT COUNT(*) FROM ohlcv_cache")
                  print("[db_rows_ohlcv_cache] =", cur.fetchone()[0])
                  for tbl in ("watchlist","fetcher_stats"):
                      try:
                          cur.execute(f"SELECT COUNT(*) FROM {tbl}")
                          print(f"[db_rows_{tbl}] =", cur.fetchone()[0])
                      except Exception:
                          pass
              finally:
                  conn.close()
          PY
          else
            echo "NO_DB at ${{ env.OHLCV_CACHE_DB }}"
          fi
          EXTRA_ARG=""
          if [[ -n "${INPUT_EXTRA:-}" ]]; then
            EXTRA_ARG="--extra-symbols ${INPUT_EXTRA}"
          fi
          set -x
          python -u scripts/tur_amp_health_scan.py \
            --top 800 \
            --min-days 3 \
            --report-csv "$REPORT_CSV" \
            --summary-json "$SUMMARY_JSON" \
            $EXTRA_ARG
          SCAN_RC=$?
          set +x
          echo "--- POST-SCAN FILES (artifact dir):"
          ls -la "$REPORT_CSV" "$SUMMARY_JSON" 2>/dev/null || echo "(missing artifact files)"
          {
            echo ""
            echo "---"
            echo "<details><summary>🩺 TUR/Amp Health Scan Summary (rc=$SCAN_RC)</summary>"
            echo ""
            if [[ -f "$SUMMARY_JSON" ]]; then
              echo "Raw JSON content:"
              echo '```json'
              cat "$SUMMARY_JSON" || true
              echo '```'
              echo ""
              SUMMARY_PATH="$SUMMARY_JSON" python - <<'PY'
          import json, os
          p = os.environ["SUMMARY_PATH"]
          try:
              s = json.load(open(p, encoding="utf-8"))
              c = s.get("counts", {})
              print(f"- Scanned tickers with data: **{s.get('scanned_tickers_count','?')}**")
              print(f"- Union pool (5-layer): **{s.get('union_pool_count','?')}**")
              print(f"- Status counts: OK=`{c.get('OK',0)}`  WARN=`{c.get('WARN',0)}`  FATAL=`{c.get('FATAL',0)}`")
              top = s.get("fatal_and_warn_top10") or []
              if top:
                  print("")
                  print("#### Top FATAL/WARN")
                  print("| Ticker | Status | TUR days out | Amp stale | Last TUR% | Suggested | SB method |")
                  print("|---|---|---:|---:|---:|---|---|")
                  for r in top:
                      last = r.get("tur_last_pct")
                      last_s = f"{last:.4f}" if isinstance(last,(int,float)) else "-"
                      print(f"| {r.get('ticker','')} | `{r.get('status','')}` | {r.get('tur_days_out',0)} | {r.get('amp_stale_hits',0)} | {last_s} | {r.get('suggested_factor') or '-'} | {r.get('sb_method','')} |")
              sug = s.get("suggested_factor_candidates") or []
              if sug:
                  print("")
                  print("#### Suggested float.csv rows (copy after verified with AASTOCKS):")
                  print("```csv")
                  print("ticker,company,outstanding,float_ratio,float_shares,last_update,source,confidence")
                  for row in sug:
                      print(row)
                  print("```")
          except Exception as exc:
              print(f"Summary JSON parse failed: {type(exc).__name__}: {exc}")
          PY
              RC_PY=$?
            else
              echo "_No summary JSON produced (scanner may have exited early with rc=$SCAN_RC)._"
            fi
            echo ""
            echo "_Artifact: `tur-amp-health-report-v1` (CSV + JSON)._"
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "scan_exit_code=$SCAN_RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload ohlcv_cache.sqlite as artifact (retention 30 days, v5 name)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ github.workspace }}/artifacts/ohlcv_cache.sqlite
          retention-days: 30
          if-no-files-found: ignore
          overwrite: true

      - name: Upload TUR/Amp health report artifact (CSV + JSON, retention 90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TUR_AMP_ARTIFACT_NAME }}
          path: |
            ${{ env.TUR_AMP_REPORT_DIR }}/tur_amp_health_report.csv
            ${{ env.TUR_AMP_REPORT_DIR }}/tur_amp_health_summary.json
          retention-days: 90
          if-no-files-found: ignore
          overwrite: true
